<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSS агрегатор</title>
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4" id="app-title">RSS агрегатор</h1>

    <div class="text-end mb-3">
      <select class="form-select form-select-sm w-auto d-inline-block" id="language-switcher">
        <option value="ru" selected>Русский</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8">
        <form id="rss-form" class="mb-4">
          <div class="mb-3">
            <label for="url-input" class="form-label" id="form-label">RSS ссылка</label>
            <div class="input-group">
              <input
                type="text"
                class="form-control"
                id="url-input"
                name="url"
                aria-label="url"
                placeholder="https://example.com/rss"
                required
                autofocus
                title="Пожалуйста, заполните это поле"
              >
              <button class="btn btn-primary" type="submit" id="submit-btn">
                Добавить
              </button>
            </div>
            <div class="form-text" id="form-help">
              Пример: https://ru.hexlet.io/lessons.rss
            </div>
            <div class="form-text mt-1" id="url-feedback"></div>
          </div>
        </form>

        <div id="feeds-section" class="mt-4">
          <h2 id="feeds-title" class="h4 mb-3">Фиды</h2>
          <div id="feeds-container" class="mt-3"></div>
        </div>

        <div id="posts-section" class="mt-4">
          <h2 id="posts-title" class="h4 mb-3">Посты</h2>
          <div id="posts-container" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
