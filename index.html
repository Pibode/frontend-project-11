<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSS агрегатор</title>
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">RSS агрегатор</h1>
    
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8">
        <!-- Форма - ВАЖНО: структура как ожидают тесты -->
        <form id="rss-form" class="mb-4">
          <div class="mb-3">
            <label for="url-input" class="form-label">RSS ссылка</label>
            <div class="input-group">
              <input
                type="text"
                class="form-control"
                id="url-input"
                name="url"
                placeholder="https://example.com/rss"
                required
                autofocus
              >
              <!-- ВАЖНО: кнопка должна быть button, не div -->
              <button class="btn btn-primary" type="submit" id="submit-btn">
                Добавить
              </button>
            </div>
            <div class="form-text">
              Введите URL RSS-ленты
            </div>
            <!-- ВАЖНО: feedback элемент для сообщений -->
            <div class="feedback text-danger mt-1" id="feedback"></div>
          </div>
        </form>
        
        <!-- Фиды -->
        <div class="mt-4">
          <h2 class="h4">Фиды</h2>
          <div id="feeds" class="mt-3"></div>
        </div>
        
        <!-- Посты -->
        <div class="mt-4">
          <h2 class="h4">Посты</h2>
          <div id="posts" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
