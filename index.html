<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSS агрегатор</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4" id="app-title">RSS агрегатор</h1>
    
    <!-- Переключатель языка -->
    <div class="text-end mb-3">
      <select class="form-select form-select-sm w-auto d-inline-block" id="language-switcher">
        <option value="ru" selected>Русский</option>
        <option value="en">English</option>
      </select>
    </div>
    
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8">
        <!-- Форма -->
        <form id="rss-form" class="mb-4">
          <div class="mb-3">
            <label for="url-input" class="form-label" id="form-label">RSS ссылка</label>
            <div class="input-group">
              <input
                type="text"
                class="form-control"
                id="url-input"
                name="url"
                placeholder="https://example.com/rss"
                required
                autofocus
                title="Пожалуйста, заполните это поле"
              >
              <button class="btn btn-primary" type="submit" id="submit-btn">
                Добавить
              </button>
            </div>
            <div class="form-text" id="form-help">
              Введите URL RSS-ленты
            </div>
            <div class="form-text mt-1" id="url-feedback"></div>
          </div>
        </form>
        
        <!-- Фиды -->
        <div id="feeds-section" class="mt-4">
          <div id="feeds-container" class="mt-3"></div>
        </div>
        
        <!-- Посты -->
        <div id="posts-section" class="mt-4">
          <div id="posts-container" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Модальное окно для предпросмотра поста -->
  <div class="modal fade" id="postModal" tabindex="-1" aria-labelledby="postModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="postModalTitle">Заголовок поста</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body" id="postModalBody">
          Описание поста...
        </div>
        <div class="modal-footer">
          <a href="#" class="btn btn-primary" id="postModalLink" target="_blank" rel="noopener noreferrer">
            Читать полностью
          </a>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap JS для модальных окон -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
