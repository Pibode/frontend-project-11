<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSS агрегатор</title>
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">RSS агрегатор</h1>
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <form id="rss-form" class="mb-4">
          <div class="mb-3">
            <label for="url-input" class="form-label">RSS ссылка</label>
            <div class="input-group">
              <input
                type="text"
                class="form-control"
                id="url-input"
                name="url"
                placeholder="https://example.com/rss"
                required
                autofocus
              >
              <button class="btn btn-primary" type="submit" id="submit-btn">
                Добавить
              </button>
            </div>
            <div class="form-text">
              Введите URL RSS-ленты
            </div>
            <div class="form-text text-danger mt-1" id="url-feedback"></div>
          </div>
        </form>
        
        <div class="mt-4">
          <h3 class="h5">Добавленные RSS ленты</h3>
          <div id="feeds" class="mt-3">
            <p class="text-muted">Пока нет добавленных RSS лент</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
